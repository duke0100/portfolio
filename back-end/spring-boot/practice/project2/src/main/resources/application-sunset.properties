# Sunset of v1 - see docs/interview/rest-api/01-rest-api-versioning.md#config
# Run with: --spring.profiles.active=sunset
#
# What retiring a version costs callers: X-API-Version: 1 now gets a 400, and anyone sending no
# header is silently moved to the v2 payload.
spring.mvc.apiversion.supported=2
spring.mvc.apiversion.default=2
spring.mvc.apiversion.required=true

# Only the list above counts; versions declared on controller methods are not auto-accepted.
spring.mvc.apiversion.detect-supported=false
