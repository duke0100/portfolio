server.port=8088
server.forward-headers-strategy=framework
spring.application.name=project2-postgresql

# Actuator - see docs/interview/spring-boot/01-spring-boot-actuator.md#config
# (this block is the config sample there; application-dev.properties is the "unsafe" comparison)
# Management traffic on its own port so the public listener (8082) never serves /actuator.
management.server.port=9082
management.endpoints.web.base-path=/actuator

# Allow-list. Only these four are reachable; anything added to Actuator later stays off by default.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=env,beans,configprops,heapdump,threaddump,loggers,mappings

# Health. "when-authorized" means an unauthenticated caller sees only {"status":"UP"}.
# With no Spring Security on the classpath that is effectively "never" - use the dev profile locally.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ACTUATOR_ADMIN

# Kubernetes-style probes: liveness = "restart me", readiness = "send me traffic".
# docs/interview/spring-boot/01-spring-boot-actuator.md#liveness-and-readiness
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,productCatalog
management.endpoint.health.group.readiness.show-details=always

# Info. build-info comes from the spring-boot-maven-plugin build-info goal already configured.
# docs/interview/spring-boot/01-spring-boot-actuator.md#custom-info
management.info.build.enabled=true
management.info.java.enabled=true
management.info.env.enabled=true
info.app.owner=backend-practice
info.app.contact=backend-practice@example.com

# Metrics. Histogram buckets let the scrape produce real percentiles instead of client-side averages.
# docs/interview/spring-boot/01-spring-boot-actuator.md#custom-metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,200ms,500ms,1s

# Swagger
swagger.api.name=Project2 PostgreSQL API
swagger.api.description=Spring Boot REST API backed by PostgreSQL
swagger.api.version=@project.version@

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# N+1 - see docs/interview/spring-boot/03-n-plus-one-query-problem.md#config
# Same settings are the fetch-type half of docs/interview/spring-data-jpa/03-jpa-relationship-annotations.md#config
# (this block is the production config sample there; application-dev.properties is the noisy
#  diagnostic comparison)
# No session held open for the whole request: a lazy load outside the service transaction now fails
# loudly instead of silently emitting one select per row from inside the JSON serializer.
spring.jpa.open-in-view=false

# Safety net, not a fix: any collection/proxy still loaded lazily is loaded 50 parents at a time,
# so a missed fetch join costs ceil(N/50) selects instead of N.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Powers /api/v1/performance/n-plus-one (Statistics.getPrepareStatementCount) and Actuator's
# hibernate.* meters. A few percent of overhead - keep it off if you do not read the numbers.
# docs/interview/spring-boot/03-n-plus-one-query-problem.md#measuring-it
# /api/v1/product-search also reports this count per query style - see
# docs/interview/spring-data-jpa/02-jpql-criteria-native-queries.md#config
spring.jpa.properties.hibernate.generate_statistics=true

# Fail fast on the query shape that silently pulls a whole table into the heap:
# "firstResult/maxResults with collection fetch" becomes an exception instead of a warning.
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Second-level cache - see docs/interview/spring-data-jpa/01-first-level-vs-second-level-cache.md#config
# (this block is the config sample there)
# L1 (the persistence context) always exists and needs no config. This turns on L2, which is
# shared across sessions/transactions and is therefore off by default.
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.uri=ehcache.xml

# DataSource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/project2_db
spring.datasource.username=project2_user
spring.datasource.password=project2_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=project2-postgresql-pool

# Liquibase - see docs/interview/database/01-database-migrations.md#config
# (this is the config sample there; runs on every app startup, before the context is ready to
#  serve traffic - see #versioned-migration for the V6 changelog this points at)
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# Excludes any changeset tagged context:contract (see V6-003) from the normal startup run, so a
# rolling deploy's expand/migrate steps never ship a contract step (DROP/NOT NULL) that an
# old-version instance still running the same schema would break on.
# docs/interview/database/01-database-migrations.md#rollback-strategy
spring.liquibase.contexts=!contract

# API versioning - see docs/interview/rest-api/01-rest-api-versioning.md#config
# Spring reads the version from the X-API-Version header and matches it against
# @GetMapping(version=...), so one URL can serve both versions.
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.supported=1,2

# No header means v1, so older clients - and springdoc's /v3/api-docs - keep working.
spring.mvc.apiversion.default=1
spring.mvc.apiversion.required=false

# Error handling - see docs/interview/rest-api/03-global-exception-handling.md#config
# (this block is the config sample there; application-dev.properties is the leaky comparison)
# Our own advice writes the RFC 7807 bodies, so Spring's built-in ProblemDetail advice stays off.
# Turning it on would give two advices an opinion about the same Spring MVC exception.
spring.mvc.problemdetails.enabled=false

# Nothing from the server-side failure leaks into the fallback /error body: no message, no stack
# trace, no binding errors. The traceId in the problem body is the only link back to the log.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Spring Modulith - see docs/interview/architecture/01-spring-modulith-modular-monolith.md#config
# (this block is the config sample there; src/test/resources/application.properties repeats it)
# Modules are the direct sub-packages of the modulith root (com.example.project2.modulith).
spring.modulith.detection-strategy=direct-sub-packages

# Startup verification stays off: it would verify from the @SpringBootApplication package
# (com.example.project2), where controller, service and entity would each look like a module and
# fail on cycles. ModulithArchitectureTest verifies the modulith root instead.
spring.modulith.runtime.verification-enabled=false

# Outbox. Modulith creates the event_publication table itself; the alternative is to turn this off
# and own the DDL in a Liquibase changeset, which is what you want once the table is in production.
# docs/interview/architecture/01-spring-modulith-modular-monolith.md#the-outbox
spring.modulith.events.jdbc.schema-initialization.enabled=true

# "update" keeps completed rows with a completion_date, so you can audit what was processed.
# "delete" is faster but you lose the trail; "archive" moves rows to event_publication_archive.
spring.modulith.events.completion-mode=update

# Left off on purpose: on restart it would replay every incomplete event, and with two instances
# both would replay the same ones. Resubmit deliberately via the actuator endpoint instead.
spring.modulith.events.republish-outstanding-events-on-restart=false
