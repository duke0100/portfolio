# Local-only Actuator overrides - see docs/interview/spring-boot/01-spring-boot-actuator.md#config
# (shown there as the comparison against the production settings in application.properties)
# Run with: --spring.profiles.active=dev
#
# Everything here is deliberately unsafe for production: full health details to anonymous callers,
# and the debugging endpoints that leak configuration, credentials and heap contents.
management.server.port=8082
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Local-only N+1 diagnostics - see docs/interview/spring-boot/03-n-plus-one-query-problem.md#config
# This is also how you see which side wrote the FK - docs/interview/spring-data-jpa/03-jpa-relationship-annotations.md#config
# (shown there as the comparison against the production JPA settings in application.properties)
# Also the "how to see the generated SQL" part of
# docs/interview/spring-data-jpa/02-jpql-criteria-native-queries.md#config
# Every statement on stdout: this is how you *see* the 21 selects that the statement counter only
# counts. Unusable in production - it logs a line per query and formats it over several lines.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Deliberately back to the Boot default. Lazy loads now succeed outside any transaction, from
# inside Jackson serialization, which is exactly how an N+1 hides from code review.
spring.jpa.open-in-view=true

# Hibernate's own "disabled" value: no global safety net, so every association without an explicit
# @BatchSize goes back to 1 select per parent. Order.details keeps its @BatchSize(50) - the
# annotation wins over the global setting, in both directions.
spring.jpa.properties.hibernate.default_batch_fetch_size=-1

# Local-only error detail - see docs/interview/rest-api/03-global-exception-handling.md#config
# (shown there as the comparison against the production settings in application.properties)
# Deliberately leaky: the fallback error body now echoes the exception message and the whole stack
# trace. Handy while debugging, and a free map of your internals if it ever ships.
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
server.error.include-exception=true

# Local-only idempotency overrides - see docs/interview/rest-api/04-idempotency-in-rest-apis.md#config
# (shown there as the comparison against the production TTL in application.properties)
# A 2-minute TTL is deliberately too short: it lets you watch a key expire and the "duplicate" POST
# create a second order, which is exactly the bug a real TTL prevents.
idempotency.ttl=PT2M
idempotency.cleanup-interval=PT30S

# Local-only pagination override - see docs/interview/rest-api/05-pagination-and-sorting.md#config
# (shown there as the comparison against the production cap in application.properties)
# Back to Spring's own default cap. One request can now pull 2000 of the ~1M product rows, which is
# how an export script quietly turns into a production incident.
spring.data.web.pageable.max-page-size=2000

# Left commented on purpose: switching this on in one profile only would mean page=1 returns
# different rows in dev and in prod. If a legacy client needs 1-based pages, set it everywhere.
#spring.data.web.pageable.one-indexed-parameters=true

# Local-only fan-out overrides - see docs/interview/concurrency/01-callable-vs-runnable.md#config
# (shown there as the comparison against the production values in application.properties)
# Deliberately wrong: 32 threads over a 10-connection Hikari pool means most tasks now wait on a
# connection, and the 60s budget means a stuck query holds the request thread for a minute.
catalog.snapshot.pool-size=32
catalog.snapshot.timeout=PT60S

# Local-only async overrides - see docs/interview/concurrency/02-completablefuture-vs-future.md#config
# (shown there as the comparison against the production values in application.properties)
# Deliberately wrong: 64 threads over a 10-connection Hikari pool means most stages now queue on
# Hikari instead, and the 5-minute socket read timeout means one hung partner parks a pool thread
# for five minutes while the 3s pipeline budget has already answered the client.
catalog.async.pool-size=64
catalog.async.shipping.read-timeout=5m

# Also deliberately wrong: the batch cap is now 500, so one URL can start 2500 stages at once.
catalog.async.max-batch-size=500
