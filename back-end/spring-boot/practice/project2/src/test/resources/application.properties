# Test-only overrides - see docs/interview/spring-boot/02-test-slices-vs-mockito.md#config
# Applies to every test in this module's classpath (both @SpringBootTest and @DataJpaTest read it).
# @DataJpaTest ignores spring.datasource.url anyway - it swaps in its own embedded H2 - but
# @SpringBootTest does not, so without this override it would try to reach the real Postgres
# instance on localhost:5432 and fail to start.

# Must match src/main/resources/application.properties - MetricsConfig.commonTags injects this
# via @Value("${spring.application.name}"), and this file fully shadows the main one on the test
# classpath, so without it any @SpringBootTest fails Tomcat startup with an unresolved placeholder.
spring.application.name=project2-postgresql

spring.datasource.url=jdbc:h2:mem:project2_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No Postgres-only changelog against H2; let Hibernate derive the schema from the entities instead.
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Random management port so a full-context test never collides with a real instance on 9082.
management.server.port=0

# Browse the embedded H2 while paused on a breakpoint (suspend=Thread, not All):
# http://localhost:<random-port>/h2-console with the JDBC URL above (sa / empty password).
# Needs spring-boot-h2console (test scope) - Boot 4 moved the console out of core autoconfigure.
spring.h2.console.enabled=true

# Second-level cache - see docs/interview/spring-data-jpa/01-first-level-vs-second-level-cache.md#config
# Repeated here because this file fully shadows src/main/resources/application.properties on the
# test classpath - without this, CacheDemoServiceCacheDataJpaTest would run with L2 cache off.
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.uri=ehcache.xml

# API versioning - see docs/interview/rest-api/01-rest-api-versioning.md#config
# Repeated because this file replaces the main one on the test classpath; without it versioning
# would be off and @GetMapping(version=...) would stop matching.
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.supported=1,2
spring.mvc.apiversion.default=1
spring.mvc.apiversion.required=false

# Spring Modulith - see docs/interview/architecture/01-spring-modulith-modular-monolith.md#config
# Repeated because this file replaces the main one on the test classpath; without the schema flag
# the JDBC event registry would look for event_publication in H2 and not find it.
spring.modulith.detection-strategy=direct-sub-packages
spring.modulith.events.jdbc.schema-initialization.enabled=true

# Off in tests: the runtime check would scan project2's own layered packages (controller, service,
# entity) as if they were modules. ModulithArchitectureTest verifies the real slice instead.
spring.modulith.runtime.verification-enabled=false
