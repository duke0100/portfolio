server.port=8081
server.forward-headers-strategy=framework
spring.application.name=project1-mysql

# Actuator
management.endpoints.web.exposure.include=health,metrics,info,beans,threaddump
management.endpoint.health.show-details=always

# Swagger
swagger.api.name=Project1 MySQL API
swagger.api.description=Spring Boot REST API backed by MySQL
swagger.api.version=@project.version@

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/project1_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=project1_user
spring.datasource.password=project1_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=project1-mysql-pool

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
