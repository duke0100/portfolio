server.port=8083
server.forward-headers-strategy=framework
spring.application.name=project3-cassandra

# Actuator
management.endpoints.web.exposure.include=health,metrics,info,beans,threaddump
management.endpoint.health.show-details=always

# Swagger
swagger.api.name=Project3 Cassandra API
swagger.api.description=Spring Boot REST API backed by Apache Cassandra
swagger.api.version=@project.version@

# Spring Data Cassandra
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.keyspace-name=project3_keyspace
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.username=cassandra
spring.cassandra.password=cassandra
spring.cassandra.schema-action=NONE

# Cassandra connection pool
spring.cassandra.connection.connect-timeout=5s
spring.cassandra.connection.init-query-timeout=10s
spring.cassandra.request.timeout=10s
spring.cassandra.request.consistency=LOCAL_QUORUM
spring.cassandra.request.serial-consistency=LOCAL_SERIAL

# Liquibase for Cassandra (uses JDBC wrapper)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.url=jdbc:cassandra://localhost:9042/project3_keyspace?localdatacenter=datacenter1
spring.liquibase.user=cassandra
spring.liquibase.password=cassandra
spring.liquibase.driver-class-name=com.ing.data.cassandra.jdbc.CassandraDriver
